[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-variant-research"
version = "0.1.0"
description = "Local research harness for swapped king/queen chess-variant experiments"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Center Symmetry Chess"}]
dependencies = [
  "python-chess>=1.999",
  "pandas>=3.0.2",
  "pyyaml>=6.0.1",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "jinja2>=3.1.4",
  "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=src/chess_variant_research --cov-report=term-missing --cov-fail-under=100"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
mypy_path = "src"
ignore_missing_imports = true
disallow_any_unimported = false

[tool.coverage.run]
source = ["src/chess_variant_research"]

[tool.coverage.report]
fail_under = 100
show_missing = true
